<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sensus Penduduk</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<body>
<nav class="navbar navbar-light bg-light">
    <div class="container-fluid">
        <a class="d-flex">Sensus Penduduk 2024</a>
        <form class="d-flex">
            <input class="form-control me-2" type="search" placeholder="search" aria-label="Search">
            <button class="btn btn-outline-success" type="submit">Search</button>
        </form>
    </div>
</nav>
<div class="contain-fluid">
    <h1>Sensus Penduduk</h1>
    <a th:href="@{~/kelurahan/detail}">Tambah</a>

    <table class="table table-striped">
        <thead>
        <tr>
            <th scope="col">Id</th>
            <th scope="col">Nama</th>
            <th scope="col">Kecamatan</th>
            <th scope="col">Action</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="data : ${kelurahan}">
            <th th:text="${data.id}">1</th>
            <td th:text="${data.nama}">Mark</td>
            <td th:text="${data.kecamatan}">Otto</td>
            <td>
                <a th:href="@{/kelurahan/detail/{id}(id=${data.id})}" class="btn btn-primary">
                    Detail
                </a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
