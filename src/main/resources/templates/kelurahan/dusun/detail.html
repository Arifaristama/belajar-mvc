<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dusun</title>
</head>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
<body>
<nav class="navbar navbar-light bg-light">
  <div class="container-fluid">
    <a class="navbar-brand">Informasi</a>
    <form class="d-flex">
      <input class="form-controller me-2" type="search" placeholder="search" aria-label="search">
      <button class="btn btn-outline-success" type="submit">Search</button>
    </form>
  </div>
</nav>
<div class="container-fluid">
  <h1>Dusun</h1>
  <form>
    <div class="row">
      <div class="col-12">
        <div class="mb-3">
          <label for="id" class="form-label">ID</label>
          <input type="text" class="form-control" id="id" th:value="${dusun.id}" readonly>
        </div>
        <div class="mb-3">
          <label for="nama" class="form-label">Nama</label>
          <input type="text" class="form-control" id="nama" th:value="${dusun.nama}" readonly>
        </div>
      </div>
    </div>
    <div>
      <h3>RW</h3>
        <div class="row">
          <div class="col-12">
            <div class="card">
              <div class="card-header">
                Daftar RW
              </div>
              <div class="card-body">
                <table class="table table-striped">
                  <thead>
                  <tr>
                    <th scope="col">ID</th>
                    <th scope="col">Nama</th>
                    <th scope="col">Ketua Rw</th>
                    <th scope="col">Action</th>
                  </tr>
                  </thead>
                  <tbody>
                  <tr th:each="dusun : ${dusun.rwModels}">
                    <th scope="row" th:text="${dusun.id}">1</th>
                    <td th:text="${dusun.nama}">Mark</td>
                    <td th:text="${dusun.namaRw}">Otto</td>
                    <td>
                        <a th:href="@{~/kelurahan/detail/dusun/rw/{id}(id=${dusun.id})}" class="btn btn-primary">
                          Detail
                        </a>
                    </td>
                  </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
    </div>
  </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</body>
</html>
