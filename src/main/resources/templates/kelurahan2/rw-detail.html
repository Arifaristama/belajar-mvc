<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>RW</title>
</head>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
<body>
<nav class="navbar navbar-light bg-light">
    <div class="container-fluid">
        <a class="navbar-brand">Informasi</a>
        <form class="d-flex">
            <input class="form-control me-2" type="search" placeholder="Search" aria-label="search">
            <button class="btn btn-outline-success" type="submit">Search</button>
        </form>
    </div>
</nav>
<div class="container-fluid">
    <h1>RW</h1>
    <form>
        <div class="row">
            <div class="col-12">
                <div class="mb-3">
                    <label for="id" class="form-label">ID</label>
                    <input type="text" class="form-control" id="id" th:value="${rw2.id}" readonly>
                </div>
                <div class="mb-3">
                    <label for="name" class="form-label">Nama</label>
                    <input type="text" class="form-control" id="name" th:value="${rw2.name}" readonly>
                </div>
                <div class="mb-3">
                    <label for="nameRW" class="form-label">Ketua RW</label>
                    <input type="text" class="form-control" id="nameRW" th:value="${rw2.nameRW}" readonly)x>
                </div>
            </div>
        </div>
        <div>
            <h3>RT</h3>
            <div class="row">
                <div class="col-12">
                    <div class="card">
                        <div class="card-header">
                            Daftar RT
                        </div>
                        <div class="card-body">
                            <table class="table table-striped">
                                <thead>
                                <tr>
                                    <th scope="col">ID</th>
                                    <th scope="col">Nama</th>
                                    <th scope="col">Ketua RT</th>
                                    <th scope="col">Action</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="rt : ${rw2.daftarRT2}">
                                    <th scope="row" th:text="${rt.id}">1</th>
                                    <td th:text="${rt.name}">Mark</td>
                                    <td th:text="${rt.nameRt}">Otto</td>
                                    <td>
                                        <a th:href="@{~/kelurahan2/kelurahan2/detail/{kelurahanId}/dusun/{dusunId}/rw/{rwId}/rt/{rtId}(kelurahanId=${kelurahan.id}, dusunId=${dusun.id}, rwId=${rw2.id}, rtId=${rt.id})}" class="btn btn-primary">
                                            Detail
                                        </a>
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </form>
</div>
</body>
</html>
