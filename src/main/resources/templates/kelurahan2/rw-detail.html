<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/main}">
<head>
    <meta charset="UTF-8">
    <title>RW</title>
</head>
<body>
<div class="container-fluid" layout:fragment="content">
    <h1>RW</h1>
    <form>
        <div class="row">
            <div class="col-12">
                <div class="mb-3">
                    <label for="id" class="form-label">ID</label>
                    <input type="text" class="form-control" id="id" th:value="${rw2.id}" disabled>
                </div>
                <div class="mb-3">
                    <label for="name" class="form-label">Nama</label>
                    <input type="text" class="form-control" id="name" th:value="${rw2.name}" disabled>
                </div>
                <div class="mb-3">
                    <label for="nameRW" class="form-label">Ketua RW</label>
                    <input type="text" class="form-control" id="nameRW" th:value="${rw2.nameRW}" disabled)x>
                </div>
            </div>
        </div>
        <div>
            <h3>RT</h3>
            <div class="row">
                <div class="col-12">
                    <div class="card">
                        <div class="card-header">
                            Daftar RT
                        </div>
                        <div class="card-body">
                            <table class="table table-striped">
                                <thead>
                                <tr>
                                    <th scope="col">ID</th>
                                    <th scope="col">Nama</th>
                                    <th scope="col">Ketua RT</th>
                                    <th scope="col">Action</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="rt, no : ${rw2.daftarRT2}">
                                    <th scope="row" th:text="${no.index +1}">1</th>
                                    <td th:text="${rt.name}">Mark</td>
                                    <td th:text="${rt.nameRt}">Otto</td>
                                    <td>
                                        <a th:href="@{~/kelurahan2/kelurahan2/detail/{kelurahanId}/dusun/{dusunId}/rw/{rwId}/rt/{rtId}(kelurahanId=${kelurahan.id}, dusunId=${dusun.id}, rwId=${rw2.id}, rtId=${rt.id})}" class="btn btn-primary">
                                            Detail
                                        </a>
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </form>
</div>
</body>
</html>
