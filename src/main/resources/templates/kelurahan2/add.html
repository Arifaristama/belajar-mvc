<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add</title>
</head>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
<body>
<nav class="navbar navbar-light bg-light">
    <div class="container-fluid">
        <a class="navbar-brand">Navbar</a>
        <form class="d-flex">
            <input class="form-control me-2" type="search" placeholder="Search" aria-label="search">
            <button class="btn btn-outline-success" type="submit">Search</button>
        </form>
    </div>
</nav>
<div class="container-fluid">
    <h1>Kelurahan</h1>
    <form th:action="@{~/kelurahan2/save}" method="post">
        <div class="row">
            <div class="col-12">
                <div class="mb-3">
                    <label for="id" class="form-label">ID</label>
                    <input type="text" class="form-control" id="id" name="id" th:value="${kelurahan.id}">
                </div>
                <div class="mb-3">
                    <label for="nama" class="form-label">Nama</label>
                    <input type="text" class="form-control" id="nama" name="nama" th:value="${kelurahan.nama}">
                </div>
                <div class="mb-3">
                    <label for="kecamatan" class="form-label">Kecamatan</label>
                    <input type="text" class="form-control" id="kecamatan" name="kecamatan" th:value="${kelurahan.kecamatan}">
                </div>
            </div>
        </div>
        <h3>Dusun</h3>
        <div class="row" th:each="dusun, dusIter : ${kelurahan.daftarDusun2}">
            <input type="hidden" th:name="|daftarDusun2[${dusIter.index}].id|" th:value="${dusIter.index + 5}">
            <div class="col-12">
                <div class="mb-3">
                    <label th:for="|id_${dusIter.index}_name|" class="form-label">Nama Dusun</label>
                    <input type="text" class="form-control" th:id="|id_${dusIter.index}_name|" th:name="|daftarDusun2[${dusIter.index}].name|">
                </div>
            </div>
            <h3>RW</h3>
            <div class="row" th:each="rw, rwIter : ${dusun.daftarRW2}">
                <input type="hidden" th:name="|daftarDusun2[${dusIter.index}].daftarRW2[${rwIter.index}].id|" th:value="${rwIter.index + 5}">
                <div class="col-12">
                    <div class="mb-3">
                        <label th:for="|id_${rwIter.index}_name|" class="form-label">RW</label>
                        <input type="text" class="form-control" th:id="|id_${rwIter.index}_name|" th:name="|daftarDusun2[${dusIter.index}].daftarRW2[${rwIter.index}].name|">
                    </div>
                    <div class="mb-3">
                        <label th:for="|id_${rwIter.index}_nameRW|" class="form-label">Nama RW</label>
                        <input type="text" class="form-control" th:id="|id_${rwIter.index}_nameRW|" th:name="|daftarDusun2[${dusIter.index}].daftarRW2[${rwIter.index}].nameRW|">
                    </div>
                </div>
                <h3>RT</h3>
                <div class="row" th:each="rt, rtIter : ${rw.daftarRT2}">
                    <input type="hidden" th:name="|daftarDusun2[${dusIter.index}].daftarRW2[${rwIter.index}].daftarRT2[${rtIter.index}].id|" th:value="${rwIter.index + 5}">
                    <div class="col-12">
                        <div class="mb-3">
                            <label th:for="|id_${rwIter.index}_name|" class="form-label">RT</label>
                            <input type="text" class="form-control" th:id="|id_${rwIter.index}_name|" th:name="|daftarDusun2[${dusIter.index}].daftarRW2[${rwIter.index}].daftarRT2[${rtIter.index}].name|">
                        </div>
                        <div class="mb-3">
                            <label th:for="|id_${rwIter.index}_nameRt|" class="form-label">Nama RT</label>
                            <input type="text" class="form-control" th:id="|id${rwIter.index}_nameRt|" th:name="|daftarDusun2[${dusIter.index}].daftarRW2[${rwIter.index}].daftarRT2[${rtIter.index}].nameRt|">
                        </div>
                    </div>
                    <h3>Warga</h3>
                    <div class="row" th:each="warga, wargaIter : ${rt.daftarWarga2}">
                        <div class="col-12">
                            <div class="card">
                                <div class="card-body">
                                    <table class="table table-striped">
                                        <thead>
                                        <tr>
                                            <th>#</th>
                                            <th>Nik</th>
                                            <th>Nama Warga</th>
                                            <th>jenis Kelamin</th>
                                            <th>Usia</th>
                                        </tr>
                                        </thead>
                                        <tbody>
                                        <tr th:each="warga, wargaIter : ${rt.daftarWarga2}">
                                            <th scope="row" th:text="${wargaIter.index + 1}">1</th>
                                            <td>
                                                <input type="text" class="form-control" th:name="|daftarDusun2[${dusIter.index}].daftarRW2[${rwIter.index}].daftarRT2[${rtIter.index}].daftarWarga2[${wargaIter.index}].nik|">
                                            </td>
                                            <td>
                                                <input type="text" class="form-control" th:name="|daftarDusun2[${dusIter.index}].daftarRW2[${rwIter.index}].daftarRT2[${rtIter.index}].daftarWarga2[${wargaIter.index}].namaWarga|">
                                            </td>
                                            <td>
                                                <select class="form-select" th:name="|daftarDusun2[${dusIter.index}].daftarRW2[${rwIter.index}].daftarRT2[${rtIter.index}].daftarWarga2[${wargaIter.index}].jenisKelamin|">
                                                    <option value="">Tidak Ingin Menjawab</option>
                                                    <option value="pria">Pria</option>
                                                    <option value="wanita">Wanita</option>
                                                </select>
                                            </td>
                                            <td>
                                                <input type="text" class="form-control" th:name="|daftarDusun2[${dusIter.index}].daftarRW2[${rwIter.index}].daftarRT2[${rtIter.index}].daftarWarga2[${wargaIter.index}].age|">
                                            </td>
                                        </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="module-footer">
            <button type="submit" class="btn btn-primary">Save</button>
            <button type="reset" class="btn btn-secondary">
                <a th:href="@{~/kelurahan2}">Close</a>
            </button>
        </div>
    </form>
</div>
</body>
</html>
