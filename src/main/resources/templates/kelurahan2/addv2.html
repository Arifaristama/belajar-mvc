<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>add</title>
</head>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
<body>
<nav class="navbar navbar-light bg-light">
    <div class="container-fluid">
        <a class="navbar-brand">Navbar</a>
        <form class="d-flex">
            <input class="form-control me-2" type="search" placeholder="Search" aria-label="search">
            <button class="btn btn-outline-success" type="submit">Search</button>
        </form>
    </div>
</nav>
<div class="container-fluid">
    <h1>Kelurahan</h1>
    <form th:action="@{~/kelurahan2/save}" method="post">
        <div class="row">
            <div class="col-12">
                <div class="mb-3">
                    <label for="id" class="form-label">ID</label>
                    <input type="text" class="form-control" id="id" name="id" th:value="${kelurahan.id}">
                </div>
                <div class="mb-3">
                    <label for="nama" class="form-label">Nama</label>
                    <input type="text" class="form-control" id="nama" name="nama" th:value="${kelurahan.nama}">
                </div>
                <div class="mb-3">
                    <label for="kecamatan" class="form-label">Kecamatan</label>
                    <input type="text" class="form-control" id="kecamatan" name="kecamatan" th:value="${kelurahan.kecamatan}">
                </div>
            </div>
        </div>
        <h3>Dusun</h3>
        <div id="dusun-container">
            <div class="row dusun-add" th:each="dusun, dusIter : ${kelurahan.daftarDusun2}">
                <button type="button" class="btn btn-primary btn-add">Add</button>
                <div class="col-12">
                    <div class="mb-3">
                        <label th:for="|id_${dusIter.index}_name|" class="form-label">Nama Dusun</label>
                        <input type="text" class="form-control" th:id="|id_${dusIter.index}_name|" th:name="|daftarDusun2[${dusIter.index}].name|">
                    </div>
                </div>
            </div>
        </div>
        <div class="module-footer">
            <button type="submit" class="btn btn-primary">Save</button>
            <button type="reset" class="btn btn-secondary">
                <a th:href="@{~/kelurahan2}">Close</a>
            </button>
        </div>
    </form>
</div>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script>
    $(document).ready(function (){
        $('#dusun-container').on('click', '.btn-add', function (){
            var indexDusun = $('#dusun-container .dusun-add').length;
            var newDusun = '<div class="row dusun-add">\n' +
                '                <div class="col-12">\n' +
                '                    <div class="mb-3">\n' +
                '                        <label for="id_'+ indexDusun +'_name" class="form-label">Nama Dusun</label>\n' +
                '                        <input type="text" class="form-control" id="id_'+ indexDusun +'_name" name="daftarDusun2['+ indexDusun +'].name">\n' +
                '                    </div>\n' +
                '                </div>\n' +
                '            </div>';
            $('#dusun-container').append(newDusun);
        });
    });
</script>
</body>
</html>
