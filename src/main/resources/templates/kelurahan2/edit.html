<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit</title>
</head>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
<body>
<nav class="navbar navbar-light bg-light">
    <div class="container-fluid">
        <a class="navbar-brand">Navbar</a>
        <form class="d-flex">
            <input class="form-control me-2" type="search" placeholder="Search" aria-label="search">
            <button class="btn btn-outline-success" type="submit">Search</button>
        </form>
    </div>
</nav>
<div class="container-fluid">
    <h3>Kelurahan</h3>
    <form th:action="@{~/kelurahan2/update}" method="post">
        <input type="hidden" name="id" th:value="${kelurahan.id}">
        <div class="row">
            <div class="col-12">
                <div class="mb-3">
                    <label for="nama" class="form-label">Nama Kelurahan</label>
                    <input type="text" class="form-control" id="nama" name="nama" th:value:="${kelurahan.nama}">
                </div>
                <div class="mb-3">
                    <label for="kecamatan" class="form-label">Kecamatan</label>
                    <input type="text" class="form-control" id="kecamatan" name="kecamtan" th:value="${kelurahan.kecamatan}">
                </div>
            </div>
        </div>
        <h3>Dusun</h3>
        <div class="row" th:each="dusun, dusIter : ${kelurahan.daftarDusun2}">
            <input type="hidden" th:name="|daftarDusun2[${dusIter.index}].id|" th:value="${dusIter.index + 5}">
            <div class="col-12">
                <div class="mb-3">
                    <label th:for="|id_${dusIter.index}_name|" class="form-label">Nama Dusun</label>
                    <input type="text" class="form-control" th:id="|id_${dusIter.index}_name|" th:name="|daftarDusun2[${dusIter.index}].name|" th:value="${dusun.name}">
                </div>
            </div>
            <h3>RW</h3>
            <div class="row" th:each="rw, rwIter : ${dusun.daftarRW2}">
                <input type="hidden" th:name="|daftarDusun2[${dusIter.index}].daftarRW2[${rwIter.index}]id|" th:value="${rwIter.index + 5}">
                <div class="col-12">
                    <div class="mb-3">
                        <label th:for="|id_${rwIter.index}_name|" class="form-label">RW</label>
                        <input type="text" class="form-control" th:id="|id_${rwIter.index}_name|" th:name="|daftarDusun2[${dusIter.index}].daftarRW2[${rwIter.index}].name|" th:value="${rw.name}">
                    </div>
                    <div class="mb-3">
                        <label th:for="|id_${rwIter.index}_nameRW|" class="form-label">Nama RW</label>
                        <input type="text" class="form-control" th:id="|id_${rwIter.index}_nameRwW|" th:name="|daftarDusun2[${dusIter.index}].daftarRW2[${rwIter.index}].nameRW|" th:value="${rw.nameRW}">
                    </div>
                </div>
                <h3>RT</h3>
                <div class="row" th:each="rt, rtIter : ${rw.daftarRT2}">
                    <input type="hidden" th:name="|daftarDusun2[${dusIter.index}].daftarRW2[${rwIter.index}].daftarRT2[${rtIter.index}].id|" th:value="${rtIter.index + 5}">
                    <div class="col-12">
                        <div class="mb-3">
                            <label th:for="|id_${rwIter.index}_name|" class="form-label">Nama</label>
                            <input type="text" class="form-control" th:id="|id_${rwIter.index}_name|" th:name="|daftarDusun2[${dusIter.index}].daftarRW2[${rwIter.index}].daftarRT2[${rtIter.index}].name|" th:value="${rt.name}">
                        </div>
                        <div class="mb-3">
                            <label th:for="|id_${rwIter.index}_nameRT|" class="form-label">Nama RT</label>
                            <input type="text" class="form-control" th:id="|id_${rwIter.index}_nameRT|" th:name="|DaftarDusun2[${dusIter.index}].daftarRW2[${rwIter.index}].daftarRT2[${rtIter.index}].nameRT|" th:value="${rt.nameRt}">
                        </div>
                        <h3>Warga</h3>
                        <div class="row" th:each="warga, warIter : ${rt.daftarWarga2}">
                            <div class="col-12">
                                <div class="card">
                                    <div class="card-body">
                                        <table class="table table-striped">
                                            <thead>
                                            <tr>
                                                <th>#</th>
                                                <th>Nik</th>
                                                <th>Nama Warga</th>
                                                <th>Jenis Kelamin</th>
                                                <th>Umur</th>
                                            </tr>
                                            </thead>
                                            <tbody>
                                            <tr th:each="warga, warIter : ${rt.daftarWarga2}">
                                                <th scope="row" th:text=""
                                            </tr>
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </form>
</div>
</body>
</html>
