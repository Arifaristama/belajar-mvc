<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>RT</title>
</head>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
<body>
<nav class="navbar navbar-light bg-light">
    <div class="container-fluid">
        <a class="navbar-brand">Informasi</a>
        <form class="d-flex">
            <input class="form-control me-2" type="search" placeholder="Search" aria-label="search">
            <button class="btn btn-outline-success" type="submit">Search</button>
        </form>
    </div>
</nav>
<div class="container-fluid">
    <h1>RT</h1>
    <form>
        <div class="row">
            <div class="col-12">
                <div class="mb-3">
                    <label for="id" class="form-label">ID</label>
                    <input type="text" class="form-control" id="id" th:value="${rt2.id}" readonly>
                </div>
                <div class="mb-3">
                    <label for="name" class="form-label">Nama</label>
                    <input type="text" class="form-control" id="name" th:value="${rt2.name}" readonly>
                </div>
                <div class="mb-3">
                    <label for="nameRT" class="form-label">Nama RT</label>
                    <input type="text" class="form-control" id="nameRT" th:value="${rt2.nameRt}">
                </div>
            </div>
        </div>
        <div>
            <div class="row">
                <div class="col-12">
                    <div class="card">
                        <div class="card-header">
                            Daftar Warga
                        </div>
                    </div>
                    <div class="card-body">
                        <table class="table table-striped">
                            <thead>
                            <tr>
                                <th scope="col">No</th>
                                <th scope="col">Nik</th>
                                <th scope="col">Nama</th>
                                <th scope="col">Jenis Kelamin</th>
                                <th scope="col">Usia</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="daftarWarga : ${rt2.daftarWarga2}">
                                <th scope="row" th:text="${daftarWarga.id}">1</th>
                                <td th:text="${daftarWarga.nik}">Mark</td>
                                <td th:text="${daftarWarga.namaWarga}">Otto</td>
                                <td th:text="${daftarWarga.jenisKelamin}">Otto</td>
                                <td th:text="${daftarWarga.age}">Otto</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </form>
</div>
</body>
</html>
