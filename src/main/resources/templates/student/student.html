<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/main}">
<head>
    <meta charset="UTF-8">
    <title>Riwayat</title>
</head>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<body>
<div class="container-fluid" layout:fragment="content">
    <h1>History StudentModel</h1>
    <a th:href="@{~/student/add}">Add</a>

    <table class="table table-striped">
        <thead>
        <tr>
            <th scope="col">id</th>
            <th scope="col">Nis</th>
            <th scope="col">Nama</th>
            <th scope="col">Alamat</th>
            <th scope="col">Action</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="data : ${student}">
            <th scope="row" th:text="${data.id}">1</th>
            <td th:text="${data.nis}">Mark</td>
            <td th:text="${data.nama}">Otto</td>
            <td th:text="${data.alamat}">Otto</td>
            <td>

                <a th:href="@{~/student/detail/{id}(id=${data.id})}" class="btn btn-primary">
                    Detail <i class="bi bi-eye"></i>
                </a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
